<script>
const $=id=>document.getElementById(id);
const ASSET="https://cdn.jsdelivr.net/gh/misode/mcmeta@assets/assets/minecraft/textures/";



// yank a number outta a number provider (constant, {min,max}, uniform, binomial n all that)
function numProvider(np,luck,dflt){
  if(np==null)return dflt!=null?dflt:1;
  if(typeof np==="number")return np;
  if(typeof np==="object"){
    if(np.type&&np.type.replace("minecraft:","")==="binomial")
      return (numProvider(np.n,luck))*(numProvider(np.p,luck));
    if("min"in np&&"max"in np)return (numProvider(np.min,luck)+numProvider(np.max,luck))/2;
    if("value"in np)return numProvider(np.value,luck);
  }
  return 1;
}

// how likely a condition passes. random_chance i can actually work out, everything
// else i just assume passes n flag it since that stuff depends on the world which i cant see
function condChance(c,luck,flags){
  const t=(c.condition||c.type||"").replace("minecraft:","");
  if(t==="random_chance")return numProvider(c.chance,luck);
  if(t==="random_chance_with_enchanted_bonus"){
    const base=numProvider(c.unenchanted_chance!=null?c.unenchanted_chance:c.chance,luck);
    return base;
  }
  if(t==="inverted"&&c.term)return 1-condChance(c.term,luck,flags);
  if(t==="all_of"&&c.terms)return c.terms.reduce((a,x)=>a*condChance(x,luck,flags),1);
  if(t==="any_of"&&c.terms)return 1-c.terms.reduce((a,x)=>a*(1-condChance(x,luck,flags)),1);
  flags.assumed=true; // condition we can't evaluate, assumed to pass
  return 1;
}
function condList(list,luck,flags){
  if(!list||!list.length)return 1;
  return list.reduce((a,c)=>a*condChance(c,luck,flags),1);
}

// squash the composite entries (group/alternatives/sequence) down into plain weighted ones
function expand(entry,luck,flags){
  const t=(entry.type||"").replace("minecraft:","");
  if(t==="group"&&entry.children)return entry.children.flatMap(e=>expand(e,luck,flags));
  if(t==="sequence"&&entry.children)return entry.children.flatMap(e=>expand(e,luck,flags));
  if(t==="alternatives"&&entry.children){
    // first kid whose conditions pass, im just approximating it by pass chance
    const out=[];let remain=1;
    for(const ch of entry.children){
      const pc=condList(ch.conditions,luck,flags);
      const kids=expand(ch,luck,flags);
      const kw=kids.reduce((a,k)=>a+k._w,0)||1;
      kids.forEach(k=>{k._w=k._w/kw*remain*pc;out.push(k);});
      remain*=(1-pc);
      if(remain<=0)break;
    }
    return out;
  }
  // a single normal entry
  const w=(entry.weight!=null?entry.weight:1)+(entry.quality||0)*luck;
  return [{...entry,_w:Math.max(0,w)}];
}

let model=null; // parsed table with computed per-pool entries

function build(luck){
  let data;
  try{data=JSON.parse($("json").value);}
  catch(e){throw "Invalid JSON: "+e.message;}
  const pools=data.pools||[];
  if(!Array.isArray(pools))throw "No pools array found.";
  const flags={assumed:false};
  const out=pools.map((pool,pi)=>{
    const rolls=numProvider(pool.rolls,luck,1)+numProvider(pool.bonus_rolls,luck,0)*luck;
    const poolPass=condList(pool.conditions,luck,flags);
    let entries=(pool.entries||[]).flatMap(e=>{
      const flat=expand(e,luck,flags);
      // scale the weight down by the entrys own conditions
      return flat.map(f=>{
        const pc=condList(f.conditions,luck,flags);
        return {...f,_w:f._w*pc};
      });
    });
    const total=entries.reduce((a,e)=>a+e._w,0)||1;
    entries.forEach(e=>{
      e._perRoll=e._w/total;              // chance this entry wins one roll
      e._chance=poolPass*(1-Math.pow(1-e._perRoll,Math.max(0,rolls))); // at least once across rolls
      e._name=e.name||(e.type||"").replace("minecraft:","");
      e._count=avgCount(e,luck);
    });
    return {rolls,poolPass,entries,total,raw:pool,index:pi};
  });
  model={data,pools:out,flags};
  return model;
}

// avg item count from set_count if it has one, otherwise just 1
function avgCount(entry,luck){
  const fns=entry.functions||[];
  let c=1;
  for(const f of fns){
    const t=(f.function||"").replace("minecraft:","");
    if(t==="set_count")c=numProvider(f.count,luck);
  }
  return c;
}

function itemIcon(name,isEmpty){
  const id=isEmpty?"barrier":(name||"").replace("minecraft:","");
  const img=document.createElement("img");
  img.className="icon";img.alt=id;img.title=id;img.loading="lazy";
  img.src=ASSET+"item/"+id+".png";
  img.onerror=()=>{ if(img.dataset.tried)return; img.dataset.tried="1";
    img.src=ASSET+"block/"+id+".png"; };
  return img;
}

// remember which pools ur got open so recalcing doesnt slam em all shut
let openPools={};
// the target %s u typed in, keyed by pool:index, used when u hit convert
let targetPct={};

function render(){
  const box=$("results");box.innerHTML="";
  if(model.flags.assumed){
    const n=document.createElement("div");n.className="hint";
    n.style.marginBottom="8px";
    n.innerHTML='Some conditions depend on world state (loot context, tools, entities) and are assumed to pass. Those chances are upper bounds.';
    box.appendChild(n);
  }
  model.pools.forEach((p,pi)=>{
    const d=document.createElement("div");d.className="pool"+(openPools[pi]?" open":"");
    const rollTxt=p.rolls===Math.round(p.rolls)?p.rolls:p.rolls.toFixed(2);
    const head=document.createElement("div");head.className="poolHead";
    head.innerHTML='<span class="arrow">&#9654;</span>Pool '+(pi+1)+
      '<span class="sub"> &middot; '+rollTxt+' roll'+(p.rolls===1?"":"s")+
      (p.poolPass<1?' &middot; pool passes '+(p.poolPass*100).toFixed(1)+"%":"")+'</span>';
    head.onclick=()=>{openPools[pi]=!openPools[pi];d.classList.toggle("open",openPools[pi]);};
    d.appendChild(head);
    const body=document.createElement("div");body.className="poolBody";
    p.entries.forEach((e,ei)=>{
      const isEmpty=(e.type||"").replace("minecraft:","")==="empty";
      const row=document.createElement("div");row.className="item"+(isEmpty?" emptyItem":"");
      row.appendChild(itemIcon(e._name,isEmpty));
      const nm=document.createElement("span");nm.className="iname";
      nm.textContent=isEmpty?"nothing":e._name.replace("minecraft:","");
      if((e.type||"").replace("minecraft:","")==="loot_table")
        nm.innerHTML+='<span class="tag">ref</span>';
      row.appendChild(nm);
      const bar=document.createElement("div");bar.className="bar";
      const fill=document.createElement("span");fill.style.width=(e._chance*100).toFixed(1)+"%";
      bar.appendChild(fill);row.appendChild(bar);
      const avg=document.createElement("span");avg.className="avg";
      avg.textContent=e._count!==1?("x"+ (e._count%1?e._count.toFixed(1):e._count)):"";
      row.appendChild(avg);
      // the editable %. leave it blank n it shows the real number, type one n it becomes ur target for convert
      const pct=document.createElement("div");pct.className="pct";
      const pi_ei=pi+":"+ei;
      const inp=document.createElement("input");inp.type="number";inp.min="0";inp.max="100";inp.step="0.1";
      inp.value=targetPct[pi_ei]!=null?targetPct[pi_ei]:(e._chance*100).toFixed(2);
      inp.title="target drop %";
      inp.oninput=()=>{targetPct[pi_ei]=inp.value===""?null:+inp.value;};
      pct.appendChild(inp);
      const sign=document.createElement("span");sign.textContent="%";pct.appendChild(sign);
      row.appendChild(pct);
      body.appendChild(row);
    });
    d.appendChild(body);
    box.appendChild(d);
  });
}

// convert: for every pool where u typed a target %, work out new whole weights so
// the drop chance matches. anything u left blank keeps its ratio
function convertWeights(){
  if(!model||!model.data){$("err").textContent="Calculate a table first.";return;}
  const data=model.data;
  (data.pools||[]).forEach((pool,pi)=>{
    // the normal entries in order, skippin the composite ones for this pool
    const singles=(pool.entries||[]).map((e,ei)=>({e,ei}))
      .filter(o=>["group","alternatives","sequence"].indexOf((o.e.type||"").replace("minecraft:",""))<0);
    // which ones did u actually pin a target on
    const pinned=singles.map(o=>({...o,t:targetPct[pi+":"+o.ei]}))
      .filter(o=>o.t!=null&&!isNaN(o.t));
    if(!pinned.length)return;
    const TOTAL=1000; // resolve to integer weights out of a fixed total
    let used=0,pinnedSum=0;
    pinned.forEach(o=>{pinnedSum+=Math.max(0,Math.min(100,o.t));});
    if(pinnedSum>100)pinnedSum=100;
    // give the pinned ones their slice of the total
    pinned.forEach(o=>{const w=Math.round(Math.max(0,Math.min(100,o.t))/100*TOTAL);
      o.e.weight=w;used+=w;});
    // spread whats left over the unpinned ones, keepin their ratio the same
    const rest=singles.filter(o=>targetPct[pi+":"+o.ei]==null);
    const oldRestSum=rest.reduce((a,o)=>a+(o.e.weight!=null?o.e.weight:1),0)||1;
    const remain=Math.max(0,TOTAL-used);
    rest.forEach(o=>{const ow=o.e.weight!=null?o.e.weight:1;
      o.e.weight=Math.max(0,Math.round(ow/oldRestSum*remain));});
  });
  $("json").value=JSON.stringify(data,null,2);
  targetPct={};        // clear pins now that they're baked in
  recalc();
}

function recalc(){
  try{build(+$("luck").value||0);render();$("err").textContent="";}
  catch(e){$("err").textContent=e;}
}

$("calc").onclick=()=>{targetPct={};recalc();};
$("convert").onclick=convertWeights;
$("luck").oninput=recalc;
$("copy").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText($("json").value);};

// simulate: literally roll the table n times n count it up
document.querySelectorAll(".rollBtn").forEach(b=>b.onclick=()=>{
  let data;try{data=JSON.parse($("json").value);}catch(e){$("err").textContent="Fix the JSON first.";return;}
  const n=+b.dataset.n,luck=+$("luck").value||0;
  const seenIn={},qtyTotal={};let withLoot=0;
  // each rollTable call is like openin one container
  for(let i=0;i<n;i++){
    const stacks=rollTable(data,luck);           // {item: count} for this container
    let any=false;
    for(const k in stacks){seenIn[k]=(seenIn[k]||0)+1;qtyTotal[k]=(qtyTotal[k]||0)+stacks[k];any=true;}
    if(any)withLoot++;
  }
  const keys=Object.keys(seenIn).sort((a,b)=>seenIn[b]-seenIn[a]);
  const out=$("simOut");
  if(!keys.length){out.innerHTML='<div class="hint">'+n+' containers, nothing dropped.</div>';return;}
  const head=document.createElement("div");head.className="hint";
  head.textContent=n+" containers · "+(withLoot/n*100).toFixed(1)+"% had loot";
  out.innerHTML="";out.appendChild(head);
  const maxSeen=Math.max(...keys.map(k=>seenIn[k]),1);
  keys.forEach(k=>{
    const isEmptyKey=k==="(nothing)";
    const rowEl=document.createElement("div");rowEl.className="simItem";
    rowEl.appendChild(itemIcon(k,isEmptyKey));
    const nm=document.createElement("div");nm.className="simName";
    const avgPer=qtyTotal[k]/n;                   // avg items per container across ALL containers
    const avgWhenPresent=qtyTotal[k]/seenIn[k];   // avg count in containers that had it
    nm.innerHTML=(isEmptyKey?"nothing":k.replace("minecraft:",""))+
      ' <small>'+avgPer.toFixed(2)+' per container'+
      (avgWhenPresent>1?' · '+avgWhenPresent.toFixed(1)+' when it drops':'')+'</small>';
    rowEl.appendChild(nm);
    const bar=document.createElement("div");bar.className="simBar";
    const fill=document.createElement("span");fill.style.width=(seenIn[k]/maxSeen*100)+"%";
    bar.appendChild(fill);rowEl.appendChild(bar);
    const pc=document.createElement("div");pc.className="simPct";
    pc.textContent=(seenIn[k]/n*100).toFixed(1)+"%";
    rowEl.appendChild(pc);
    out.appendChild(rowEl);
  });
});

// roll the whole table once, thats one container. gives back {itemId: totalCount}.
// cares about the pool type, a tiered/sequential one only gives one thing per roll
// (like archaeology) n a normal weighted one can repeat across rolls (like a chest)
function rollTable(data,luck){
  const got={};
  const add=(id,ct)=>{got[id]=(got[id]||0)+ct;};
  for(const pool of (data.pools||[])){
    if(!passRoll(pool.conditions,luck))continue;
    let rolls=Math.round(numProvider(pool.rolls,luck,1)+numProvider(pool.bonus_rolls,luck,0)*luck);
    for(let r=0;r<rolls;r++){
      const entries=[];
      for(const e of (pool.entries||[]))collectRollable(e,luck,entries);
      const tot=entries.reduce((a,e)=>a+e._w,0);
      if(tot<=0)continue;
      let pick=Math.random()*tot;
      for(const e of entries){pick-=e._w;if(pick<=0){
        const t=(e.type||"").replace("minecraft:","");
        if(t==="empty")add("(nothing)",1);
        else if(t==="loot_table")add((e.value||e.name||"?ref")+" (ref)",1);
        else add(e.name||"?",Math.max(0,Math.round(avgOrSampleCount(e,luck))));
        break;
      }}
    }
  }
  return got;
}
// grab a set_count if its there, otherwise 1
function avgOrSampleCount(entry,luck){
  let c=1;
  for(const f of (entry.functions||[])){
    const t=(f.function||"").replace("minecraft:","");
    if(t==="set_count"){const q=f.count;
      if(typeof q==="number")c=q;
      else if(q&&q.min!=null&&q.max!=null){const lo=numProvider(q.min,luck),hi=numProvider(q.max,luck);
        c=Math.round(lo+Math.random()*(hi-lo));}
      else c=numProvider(q,luck);}
  }
  return c;
}
function passRoll(list,luck){
  if(!list)return true;
  for(const c of list){
    const t=(c.condition||c.type||"").replace("minecraft:","");
    if(t==="random_chance"){if(Math.random()>=numProvider(c.chance,luck))return false;}
    // everything else i just assume passes
  }
  return true;
}
function collectRollable(entry,luck,out){
  const t=(entry.type||"").replace("minecraft:","");
  if(["group","sequence"].indexOf(t)>=0&&entry.children){entry.children.forEach(c=>collectRollable(c,luck,out));return;}
  if(t==="alternatives"&&entry.children){
    for(const c of entry.children){if(passRoll(c.conditions,luck)){collectRollable(c,luck,out);break;}}
    return;
  }
  if(!passRoll(entry.conditions,luck))return;
  const w=(entry.weight!=null?entry.weight:1)+(entry.quality||0)*luck;
  out.push({...entry,_w:Math.max(0,w)});
}
