<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Display 1.21.11</title>
<link rel="stylesheet" href="ui/style.css">
<style>
  .wrap{max-width:900px;margin:0 auto;padding:14px 18px 40px;overflow-x:hidden}
  html,body{max-width:100%;overflow-x:hidden}
  /* canvas mode picker */
  .modes{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  /* the editor + preview split */
  .split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.split{grid-template-columns:1fr}}
  .editArea{width:100%;min-height:180px;background:#000;border:2px solid #a0a0a0;color:#e0e0e0;
    font-family:'MinecraftTTF','VT323',monospace;font-size:17px;padding:8px 10px;resize:vertical;line-height:1.4}
  .editArea:focus{outline:none;border-color:#fff}
  /* format toolbar */
  .fmtbar{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
  .fmtbar button{padding:3px 9px;font-size:17px}
  .fmtbar button.on{background:#6d9c50;box-shadow:inset 2px 2px 0 #c8e8b0, inset -2px -2px 0 #2b451c}
  .swatch{width:24px;height:24px;border:2px solid #1a1a1a;cursor:pointer;padding:0}
  .swatch.on{outline:2px solid #fff;outline-offset:1px}
  .colors{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0;align-items:center}
  .colorPick{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
  .colorPick input[type=color]{width:34px;height:30px;padding:0;border:2px solid #1a1a1a;background:#000;cursor:pointer}
  .colorPick input[type=text]{width:110px}
  /* preview stage */
  .stage{background:#1a1a1a;border:3px solid;border-color:#555 #111 #111 #555;
    display:flex;align-items:center;justify-content:center;padding:16px;min-height:240px;position:relative}
  html.dark .stage{background:#0c0e12}
  .flipRow{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:10px;flex-wrap:wrap}
  .pageNum{color:#a0a0a0;min-width:90px;text-align:center}
  html.dark .pageNum{color:#8b93a3}
  
  #render{image-rendering:pixelated;max-width:100%;height:auto;display:block}
  .out{margin-top:14px}
  .out textarea{width:100%;min-height:80px;background:#000;border:2px solid #a0a0a0;color:#54fc54;
    font-family:'MinecraftTTF','VT323',monospace;font-size:15px;padding:8px;line-height:1.4}
  .warn{color:#fcae54;font-size:16px;min-height:20px}
  html.dark .warn{color:#f0c060}
  .sub{color:#a0a0a0;font-size:16px}
  html.dark .sub{color:#8b93a3}
</style>
</head>
<body>
<script>try{if(localStorage.getItem("pvDark")==="1")document.documentElement.classList.add("dark");}catch(e){}</script>
<script src="ui/quotes.js"></script>
<script src="ui/common.js" defer></script>
<div class="wrap">
  <header>
    <h1>Text Display</h1>
    <span class="splash" id="splash">Java 1.21.11!</span>
    <span class="hint">preview text, books and signs with the real font</span>
    <div class="hdrBtns">
      <a class="btn" href="index.html">&larr; Menu</a>
      <button id="darkBtn" class="iconBtn" title="Toggle dark mode" aria-label="Toggle dark mode"><svg class="ic-sun" viewBox="0 0 9 9" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><rect x="4" y="0" width="1" height="1"/><rect x="1" y="1" width="1" height="1"/><rect x="4" y="1" width="1" height="1"/><rect x="7" y="1" width="1" height="1"/><rect x="3" y="3" width="3" height="1"/><rect x="3" y="4" width="3" height="1"/><rect x="0" y="4" width="1" height="1"/><rect x="8" y="4" width="1" height="1"/><rect x="3" y="5" width="3" height="1"/><rect x="1" y="7" width="1" height="1"/><rect x="4" y="7" width="1" height="1"/><rect x="7" y="7" width="1" height="1"/><rect x="4" y="8" width="1" height="1"/></svg><svg class="ic-moon" viewBox="0 0 8 8" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="0" width="2" height="1"/><rect x="1" y="1" width="2" height="1"/><rect x="0" y="2" width="3" height="1"/><rect x="0" y="3" width="3" height="1"/><rect x="0" y="4" width="4" height="1"/><rect x="7" y="4" width="1" height="1"/><rect x="0" y="5" width="8" height="1"/><rect x="1" y="6" width="6" height="1"/><rect x="2" y="7" width="4" height="1"/></svg></button>
    </div>
  </header>

  
  <div class="modes">
    <button class="btn modeBtn primary" data-mode="text">Text</button>
    <button class="btn modeBtn" data-mode="book">Book</button>
    <button class="btn modeBtn" data-mode="sign">Sign</button>
  </div>

  <div class="split">
    <div>
      <div class="panel">
        <label id="editLabel">Text</label>

          <button id="fBold" title="bold"><b>B</b></button>
          <button id="fItalic" title="italic"><i>I</i></button>

<script>
const $=id=>document.getElementById(id);
const ASSET="https://cdn.jsdelivr.net/gh/misode/mcmeta@assets/assets/minecraft/textures/";
const ASSET_FB="https://raw.githubusercontent.com/misode/mcmeta/assets/assets/minecraft/textures/";


const W={' ':4,'!':2,'"':5,"'":3,'(':5,')':5,'*':5,',':2,'.':2,':':2,';':2,'<':5,'>':5,
  '@':7,'I':4,'[':4,']':4,'`':3,'f':5,'i':2,'k':5,'l':3,'t':4,'{':5,'|':2,'}':5,'~':7};
function charW(c){ return W[c]!=null?W[c]:6; }
// bold adds 1px to every glyph
function textWidth(str,bold){ let w=0; for(const c of str)w+=charW(c)+(bold?1:0); return w; }

// the 16 vanilla colors (name -> hex, and the § code)
const COLORS=[
  ["black","#000000","0"],["dark_blue","#0000AA","1"],["dark_green","#00AA00","2"],
  ["dark_aqua","#00AAAA","3"],["dark_red","#AA0000","4"],["dark_purple","#AA00AA","5"],
  ["gold","#FFAA00","6"],["gray","#AAAAAA","7"],["dark_gray","#555555","8"],
  ["blue","#5555FF","9"],["green","#55FF55","a"],["aqua","#55FFFF","b"],
  ["red","#FF5555","c"],["light_purple","#FF55FF","d"],["yellow","#FFFF55","e"],["white","#FFFFFF","f"]];

let mode="text";
let curColor="white";
const active={bold:false,italic:false,underline:false,strikethrough:false,obfuscated:false};


let bookPages=[""];
let curPage=0;
// sign: front + back, 4 lines each
let signFaces={front:"",back:""};
let signSide="front";
let signType="standing"; // or "hanging"
let signGlow=false;      // glowing text (glow ink sac)


const BOOK_W=114, BOOK_LINES=14, BOOK_MAXPAGE=100;
const SIGN_W=90, SIGN_LINES=4;

// ---- color swatches ----
function setColor(val){
  curColor=val;
  $("curColorBox").style.background=hex(val);
  // highlight the matching swatch if it's a named one
  [...$("colors").children].forEach(el=>el.classList.toggle("on",el.dataset.name===val));
  render();
}
COLORS.forEach(([name,hexv])=>{
  const b=document.createElement("button");
  b.className="swatch";b.style.background=hexv;b.title=name;b.dataset.name=name;
  b.onclick=()=>setColor(name);
  $("colors").appendChild(b);
});
// the color wheel picks any color
$("colorWheel").oninput=()=>setColor($("colorWheel").value.toUpperCase());
// the text box takes #hex OR a decimal like 16711680
$("colorApply").onclick=()=>{
  let v=$("colorText").value.trim();
  if(/^\d+$/.test(v)){ v="#"+(parseInt(v,10)&0xFFFFFF).toString(16).padStart(6,"0"); }
  if(/^#?[0-9a-fA-F]{6}$/.test(v)){ if(v[0]!=="#")v="#"+v; setColor(v.toUpperCase()); }
  else $("warn").textContent="that's not a valid hex or decimal color";
};
$("colorText").addEventListener("keydown",e=>{if(e.key==="Enter")$("colorApply").click();});

 ----
function fmtBtn(id,key){
  $(id).onclick=()=>{ active[key]=!active[key]; $(id).classList.toggle("on",active[key]);
    wrapSelection(key,active[key]); };
}
fmtBtn("fBold","bold");fmtBtn("fItalic","italic");fmtBtn("fUnder","underline");
fmtBtn("fStrike","strikethrough");fmtBtn("fObf","obfuscated");
$("fClear").onclick=()=>{ for(const k in active){active[k]=false;} 
  ["fBold","fItalic","fUnder","fStrike","fObf"].forEach(i=>$(i).classList.remove("on"));
  render(); };


function wrapSelection(){ render(); }

// ---- mode switching ----
document.querySelectorAll(".modeBtn").forEach(b=>b.onclick=()=>{
  mode=b.dataset.mode;
  document.querySelectorAll(".modeBtn").forEach(x=>x.classList.toggle("primary",x===b));
  syncModeUI();
  render();
});

function syncModeUI(){
  const isBook=mode==="book", isSign=mode==="sign";
  $("flipRow").style.display=(isBook||isSign)?"flex":"none";
  $("pageControls").style.display=isBook?"block":"none";
  $("editLabel").textContent=mode==="text"?"Text":isBook?("Page "+(curPage+1)):("Sign "+signSide);
  buildFlipRow();
  // load the right text into the editor
  if(isBook)$("editor").value=bookPages[curPage];
  else if(isSign)$("editor").value=signFaces[signSide];
  // text mode keeps whatever's there
}

function buildFlipRow(){
  const r=$("flipRow");r.innerHTML="";
  if(mode==="book"){
    const prev=document.createElement("button");prev.className="btn";prev.textContent="\u2190";
    prev.onclick=()=>{ if(curPage>0){saveEditor();curPage--;syncModeUI();render();} };
    const num=document.createElement("span");num.className="pageNum";
    num.textContent="Page "+(curPage+1)+" / "+bookPages.length;
    const next=document.createElement("button");next.className="btn";next.textContent="\u2192";
    next.onclick=()=>{ saveEditor();
      if(curPage<bookPages.length-1)curPage++;
      else if(bookPages.length<BOOK_MAXPAGE){bookPages.push("");curPage++;}
      syncModeUI();render(); };
    const del=document.createElement("button");del.className="btn";del.textContent="delete page";
    del.onclick=()=>{ if(bookPages.length>1){bookPages.splice(curPage,1);
      if(curPage>=bookPages.length)curPage=bookPages.length-1;saveEditor(true);syncModeUI();render();} };
    r.appendChild(prev);r.appendChild(num);r.appendChild(next);r.appendChild(del);
  } else if(mode==="sign"){
    const type=document.createElement("button");type.className="btn";
    type.textContent=signType==="standing"?"standing":"hanging";
    type.title="switch sign type";
    type.onclick=()=>{ signType=signType==="standing"?"hanging":"standing";buildFlipRow();render(); };
    const glow=document.createElement("button");glow.className="btn"+(signGlow?" primary":"");
    glow.textContent=signGlow?"glowing":"glow off";
    glow.title="glowing text (glow ink sac)";
    glow.onclick=()=>{ signGlow=!signGlow;buildFlipRow();render(); };
    const flip=document.createElement("button");flip.className="btn";
    flip.textContent=signSide==="front"?"flip to back \u21BB":"flip to front \u21BA";
    flip.onclick=()=>{ saveEditor();signSide=signSide==="front"?"back":"front";syncModeUI();render(); };
    r.appendChild(type);r.appendChild(glow);r.appendChild(flip);
  }
}

// pull the editor text back into the model for the current page/face
function saveEditor(skipReadBack){
  if(mode==="book")bookPages[curPage]=$("editor").value;
  else if(mode==="sign")signFaces[signSide]=$("editor").value;
}

$("editor").addEventListener("input",()=>{
  saveEditor();
  if(mode==="book")reflowBook();
  render();
});

// if the current book page wraps past 14 lines, push the overflow lines onto the
// start of the next page (making one if needed). keeps typing from just vanishing
// if the current page wraps past 14 lines, push the overflow onto the next page,
// and keep cascading so a big paste flows across as many pages as it needs
function reflowBook(){
  let p=curPage;
  while(p<BOOK_MAXPAGE){
    const wrapped=wrapToWidth(bookPages[p]||"",BOOK_W,active.bold);
    if(wrapped.length<=BOOK_LINES)break;   // this page fits, done cascading
    const keep=wrapped.slice(0,BOOK_LINES).join("\n");
    const overflow=wrapped.slice(BOOK_LINES).join("\n");
    bookPages[p]=keep;
    if(p+1>=bookPages.length){ if(bookPages.length<BOOK_MAXPAGE)bookPages.push(""); else break; }
    // prepend overflow to the next page so words don't glue together
    bookPages[p+1]=overflow+(bookPages[p+1]?" "+bookPages[p+1]:"");
    p++;                                    // check the next page too
  }
  // show the trimmed current page and refresh the page counter
  $("editor").value=bookPages[curPage];
  buildFlipRow();
}

// ---- word-wrap a string to a pixel width, returns array of lines ----
function wrapToWidth(str,maxW,bold){
  const out=[]; 
  for(const para of str.split("\n")){
    let line="",lineW=0;
    for(const word of para.split(" ")){
      const wW=textWidth(word,bold), spaceW=charW(' ')+(bold?1:0);
      if(line==="" ){ 
        // a single word longer than the line has to hard-break
        if(wW>maxW){ let chunk=""; 
          for(const c of word){ const cw=charW(c)+(bold?1:0);
            if(textWidth(chunk,bold)+cw>maxW){out.push(chunk);chunk=c;} else chunk+=c; }
          line=chunk;lineW=textWidth(chunk,bold);
        } else {line=word;lineW=wW;}
      } else if(lineW+spaceW+wW<=maxW){ line+=" "+word;lineW+=spaceW+wW; }
      else { out.push(line);line=word;lineW=wW; }
    }
    out.push(line);
  }
  return out;
}


function drawLines(ctx,lines,x,y,px,color,styles,noShadow){
  ctx.textBaseline="top";
  ctx.font=(styles.italic?"italic ":"")+(styles.bold?"bold ":"")+px+"px 'MinecraftTTF','VT323',monospace";
  lines.forEach((ln,i)=>{
    const ly=y+i*px*1.05;
    const shown=styles.obfuscated?obfuscate(ln):ln;
    if(!noShadow){
      ctx.fillStyle="rgba(0,0,0,0.55)";
      ctx.fillText(shown,x+Math.max(1,px/10),ly+Math.max(1,px/10));
    }
    ctx.fillStyle=color;
    ctx.fillText(shown,x,ly);
    const w=ctx.measureText(shown).width;
    if(styles.underline){ctx.fillRect(x,ly+px*0.9,w,Math.max(1,px/10));}
    if(styles.strikethrough){ctx.fillRect(x,ly+px*0.5,w,Math.max(1,px/10));}
  });
}

const OBFCHARS="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
function obfuscate(s){ let o=""; for(const c of s)o+= c===" "?" ":OBFCHARS[Math.random()*OBFCHARS.length|0]; return o; }
let obfTimer=null;


const bookTexCache={};
function loadTex(path,cb){
  if(bookTexCache[path])return cb(bookTexCache[path]);
  const im=new Image();im.crossOrigin="anonymous";
  im.onload=()=>{bookTexCache[path]=im;cb(im);};
  im.onerror=()=>{ if(im.dataset.fb)return cb(null); im.dataset.fb="1"; im.src=ASSET_FB+path; };
  im.src=ASSET+path;
}

const hex=name=>{ if(name&&name[0]==="#")return name; const c=COLORS.find(c=>c[0]===name);return c?c[1]:"#FFFFFF";};

// from the decompiled AbstractSignRenderer.getDarkColor: (MC render class)
// non-glowing sign text is drawn at 40% brightness. 
// glowing text uses the FULL color plus an outline at full brightness.
function darken(hexColor,f){
  const n=parseInt(hexColor.slice(1),16);
  const r=Math.floor(((n>>16)&0xFF)*f), g=Math.floor(((n>>8)&0xFF)*f), b=Math.floor((n&0xFF)*f);
  return "#"+[r,g,b].map(v=>v.toString(16).padStart(2,"0")).join("");
}
// draw one line of sign text with the glow/dark behavior
function drawSignLine(ctx,text,cx,y,fs,fullColor,glow,styles){
  ctx.font=(styles.italic?"italic ":"")+(styles.bold?"bold ":"")+fs+"px 'MinecraftTTF','VT323',monospace";
  const shown=styles.obfuscated?obfuscate(text):text;
  const tw=ctx.measureText(shown).width;
  const lx=cx-tw/2;                       // text is center-aligned, so lines start here
  const thick=Math.max(2,Math.round(fs/9));
  const mainColor=glow?(fullColor.toUpperCase()==="#000000"?"#000000":fullColor):darken(fullColor,0.4);
  const drawDecorations=()=>{
    ctx.fillStyle=mainColor;
    if(styles.underline)ctx.fillRect(lx,y+fs*0.42,tw,thick);
    if(styles.strikethrough)ctx.fillRect(lx,y-fs*0.02,tw,thick);
  };
  if(glow){
    // full-bright color with a chunky outline, like the emissive glow text.
    
    const isBlack=fullColor.toUpperCase()==="#000000";
    const outline=isBlack?"#F0EBCC":darken(fullColor,0.4);
    const o=Math.max(2,Math.round(fs/9));
    ctx.fillStyle=outline;
    for(let dx=-o;dx<=o;dx+=o)for(let dy=-o;dy<=o;dy+=o){ if(dx||dy)ctx.fillText(shown,cx+dx,y+dy); }
    // outline the decoration lines too
    if(styles.underline){ctx.fillRect(lx-o,y+fs*0.42-o,tw+2*o,thick+2*o);}
    if(styles.strikethrough){ctx.fillRect(lx-o,y-fs*0.02-o,tw+2*o,thick+2*o);}
    ctx.fillStyle=isBlack?"#000000":fullColor;ctx.fillText(shown,cx,y);
    drawDecorations();
  } else {
    // non-glowing: darken to 40% (no drop shadow on signs)
    ctx.fillStyle=mainColor;
    ctx.fillText(shown,cx,y);
    drawDecorations();
  }
}

// size the canvas backing store to its displayed size times the device pixel ratio,
// so text renders sharp instead of being a small canvas stretched up by css
function sizeCanvas(cv,cssW,cssH){
  const dpr=Math.min(window.devicePixelRatio||1,3);
  cv.style.width=cssW+"px";cv.style.height=cssH+"px";
  cv.width=Math.round(cssW*dpr);cv.height=Math.round(cssH*dpr);
  const ctx=cv.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled=false;
  return {ctx,w:cssW,h:cssH};
}

function render(){
  const cv=$("render");
  const color=hex(curColor);
  $("warn").textContent="";
  // the stage is fluid; base the canvas on its available width (capped)
  const stageW=Math.min(($("stage").clientWidth||360)-32,360);

  if(mode==="text"){
    const {ctx,w}=sizeCanvas(cv,stageW,180);
    ctx.clearRect(0,0,w,180);
    const raw=$("editor").value;
    const scale=2;
    const lines=wrapToWidth(raw,(w-20)/scale,active.bold);
    drawLines(ctx,lines,10,12,10*scale,color,active);
    buildTextOutput(raw);
  }
  else if(mode==="book"){
    saveEditor();
    const {ctx,w,h}=sizeCanvas(cv,stageW,stageW*1.23);
    loadTex("gui/book.png",img=>{
      ctx.clearRect(0,0,w,h);
      let bx=0,by=0,bw=w,bh=h;
      if(img){
        // book graphic is at (20,1) 146x180 in the sheet. fit it to the canvas
        const s=Math.min(w/146,h/180);
        bw=146*s;bh=180*s;bx=(w-bw)/2;by=(h-bh)/2;
        ctx.drawImage(img,20,1,146,180,bx,by,bw,bh);
      }
      
      const px=bx+bw*0.20, py=by+bh*0.10, pw=bw*0.62;
      const page=bookPages[curPage];
      const scale=pw/BOOK_W; // one "book pixel" = this many screen px
      const lines=wrapToWidth(page,BOOK_W,active.bold).slice(0,BOOK_LINES);

      const inkColor=color==="#FFFFFF"?"#3f3f3f":color;
      drawLines(ctx,lines,px,py,9*scale,inkColor,active,true);
      const all=wrapToWidth(page,BOOK_W,active.bold);
      if(all.length>BOOK_LINES)$("warn").textContent="this page is "+all.length+" lines, books cap at "+BOOK_LINES;
    });
    buildBookOutput();
  }
  else if(mode==="sign"){
    saveEditor();
    const {ctx,w,h}=sizeCanvas(cv,stageW,stageW*0.85);
    const path=signType==="hanging"?"gui/hanging_signs/oak.png":"gui/signs/oak.png";

    const region=signType==="hanging"
      ? {x0:1/16, x1:15/16, y0:6/16, y1:16/16}
      : {x0:0,    x1:1,     y0:0,    y1:12/26};
    loadTex(path,img=>{
      ctx.clearRect(0,0,w,h);
      let bx,by,bw,bh;
      if(img){
        const iw=img.width,ih=img.height, s=Math.min(w/iw,h/ih)*0.95;
        const dw=iw*s,dh=ih*s,ox=(w-dw)/2,oy=(h-dh)/2;
        ctx.drawImage(img,0,0,iw,ih,ox,oy,dw,dh);
        bx=ox+region.x0*dw; by=oy+region.y0*dh;
        bw=(region.x1-region.x0)*dw; bh=(region.y1-region.y0)*dh;
      } else { bx=w*0.1;by=h*0.1;bw=w*0.8;bh=h*0.5;
        ctx.fillStyle="#9c7f4e";ctx.fillRect(bx,by,bw,bh); }
      // wrap the raw text to the sign width, then keep the first 4 lines
      const allLines=wrapToWidth(signFaces[signSide],SIGN_W,active.bold);
      const faceLines=allLines.slice(0,SIGN_LINES);
      // signs render 4 lines at a fixed line height, centered vertically on the board.
      // the source does y = i*lineHeight - (4*lineHeight/2), i.e. centered. so we
      // center the 4-line block in the board and space evenly
      const lineH=bh/4.6;              // a touch of padding top/bottom
      const fs=lineH*0.82;
      const blockH=lineH*4;
      const top=by+(bh-blockH)/2;
      const cx=bx+bw/2;
      ctx.textAlign="center";ctx.textBaseline="middle";
      faceLines.forEach((ln,i)=>{
        const ly=top+lineH*i+lineH/2;
        drawSignLine(ctx,ln,cx,ly,fs,color,signGlow,active);
      });
      ctx.textAlign="left";ctx.textBaseline="top";
      if(allLines.length>SIGN_LINES)$("warn").textContent="that's "+allLines.length+" lines, a sign only fits "+SIGN_LINES;
    });
    buildSignOutput();
  }

  // keep the shimmer going if obfuscated is on
  if(active.obfuscated&&!obfTimer){ obfTimer=setInterval(()=>{ if(active.obfuscated)render(); else {clearInterval(obfTimer);obfTimer=null;} },120); }
}


function styleObj(text){
  const o={text:text};
  // named colors go as their name, custom ones as the #hex string (mc accepts both)
  if(curColor!=="white")o.color=curColor;
  for(const k of ["bold","italic","underline","strikethrough","obfuscated"])if(active[k])o[k]=true;
  return o;
}

function buildTextOutput(raw){
  const comp=styleObj(raw);
  $("output").value='/tellraw @p '+JSON.stringify(comp);
  $("outHint").textContent="a /tellraw with your styled text";
}
function buildBookOutput(){

  const pages=bookPages.map(p=>JSON.stringify(styleObj(p)));
  const nbt='written_book_content={pages:['+pages.map(p=>"'"+p.replace(/'/g,"\\'")+"'").join(",")+
    "],title:\"My Book\",author:\"me\"}";
  $("output").value="/give @p written_book["+nbt+"]";
  $("outHint").textContent=bookPages.length+" page"+(bookPages.length>1?"s":"")+", 1.21 component syntax";
}
function buildSignOutput(){
  const glowNbt=signGlow?",has_glowing_text:true":"";
  // wrap each face the same way the preview does, then pad to 4 lines
  const mk=face=>{
    const lines=wrapToWidth(signFaces[face],SIGN_W,active.bold).slice(0,SIGN_LINES);
    while(lines.length<4)lines.push("");
    return "{messages:["+lines.map(l=>JSON.stringify(styleObj(l))).join(",")+"]"+glowNbt+"}";
  };
  const block=signType==="hanging"?"oak_hanging_sign":"oak_sign";
  const nbt="front_text="+mk("front")+",back_text="+mk("back");
  $("output").value="/setblock ~ ~ ~ "+block+"["+nbt+"]";
  $("outHint").textContent="both faces, "+signType+" sign"+(signGlow?", glowing":"")+", place with /setblock";
}

$("copyBtn").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText($("output").value);};

// re-render on resize so the canvas stays sharp and fits
let rT; addEventListener("resize",()=>{clearTimeout(rT);rT=setTimeout(render,120);});
setColor("white");
syncModeUI();
render();
</script>
</body>
