<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Generator 1.21.11</title>
<link rel="stylesheet" href="ui/style.css?v=2">
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
  @font-face{font-family:'MinecraftTTF';src:url('minecraft.ttf');font-display:swap}
  *{box-sizing:border-box;image-rendering:pixelated}
  .wrap{max-width:900px;margin:0 auto;padding:14px 18px 40px}

  /* the live command box, sticky so it stays put. black n green like the code boxes on the other pages */
  #out{position:sticky;top:6px;z-index:5;margin-bottom:14px}
  #outText{background:#000;color:#54fc54;border:2px solid #a0a0a0;padding:8px 10px;font-size:16px;
    word-break:break-all;white-space:pre-wrap;min-height:38px;line-height:1.4}
  .outRow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .valid{color:#54fc54;text-shadow:2px 2px #14421e;font-size:16px}
  .invalid{color:#fcae54;font-size:16px}
  html.dark .invalid{color:#f0c060}

  /* committed segments, left accent + panel bevel */
  .seg{border:2px solid #1a1a1a;box-shadow:inset 4px 0 0 #6d9c50, inset 6px 2px 0 -2px #e8e8e8, inset -2px -2px 0 #6b6b6b;background:#b8b8b8;padding:8px 10px 8px 14px;margin:8px 0}
  html.dark .seg{background:#1b1e25;border:2px solid #0a0c10;box-shadow:inset 4px 0 0 #6d9c50, inset -2px -2px 0 #10131a}
  .segHead{display:flex;align-items:center;gap:8px}
  .segName{color:#4a4a4a;font-size:16px}
  html.dark .segName{color:#9aa2b2}
  .lit{color:#2b6d1c}
  html.dark .lit{color:#8cd97a}
  .xbtn{background:none;border:none;box-shadow:none;text-shadow:none;color:#8a2a2a;
    cursor:pointer;font-size:17px;padding:0 4px;line-height:1}
  .xbtn:hover{background:none;box-shadow:none;color:#c04a3a}

  .wrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
  .lbl{color:#3f3f3f;font-size:16px}
  html.dark .lbl{color:#c3c8d4}
  input,select,textarea{font-family:'MinecraftTTF','VT323',monospace;font-size:16px;background:#000;
    color:#e0e0e0;border:2px solid #a0a0a0;padding:4px 7px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:#fff}
  html.dark input,html.dark select,html.dark textarea{background:#0c0e12;color:#d8dbe2;border-color:#4a5162}
  html.dark input:focus,html.dark select:focus,html.dark textarea:focus{border-color:#9ecbff}
  textarea{width:100%;resize:vertical;min-height:44px;line-height:1.4}
  .coord{width:62px;text-align:center}
  .num{width:78px}
  .grow{flex:1 1 150px;min-width:0}

  /* next chooser + chips (chips are just smaller buttons) */
  .next{margin-top:12px}
  .nextLbl{color:#4a4a4a;font-size:16px;margin-bottom:6px}
  html.dark .nextLbl{color:#9aa2b2}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:16px;padding:3px 10px 1px}

  /* item component editor */
  .comp{background:#b8b8b8;border:2px solid #1a1a1a;box-shadow:inset 2px 2px 0 #e8e8e8, inset -2px -2px 0 #6b6b6b;padding:8px;margin-top:6px}
  html.dark .comp{background:#1b1e25;border:2px solid #0a0c10;box-shadow:inset 2px 2px 0 #3f4552, inset -2px -2px 0 #10131a}
  .compHead{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .compName{color:#4a4a4a;font-size:16px}
  html.dark .compName{color:#9aa2b2}
  .subrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
  .rawbox{background:#c6c6c6;border:2px dashed #6b6b6b;padding:8px;margin-top:8px}
  html.dark .rawbox{background:#23262e;border-color:#4a5162}
  .rawlbl{color:#4a4a4a;font-size:14px;margin-bottom:4px}
  html.dark .rawlbl{color:#8b93a3}
  .small{color:#4a4a4a;font-size:14px}
  html.dark .small{color:#8b93a3}
  .loading{text-align:center;color:#4a4a4a;padding:26px}
  html.dark .loading{color:#8b93a3}

  /* warnings */
  #warns{margin:10px 0}
  .warnrow{background:#d8c88a;border:2px solid;border-color:#f0d060 #8a6a10 #8a6a10 #f0d060;
    color:#3a2e00;padding:6px 10px;font-size:15px;margin-bottom:6px;line-height:1.4}
  html.dark .warnrow{background:#3a3320;border-color:#8a7a30 #201c10 #201c10 #8a7a30;color:#f0d98a}
  .warnrow code{background:rgba(0,0,0,.18);padding:0 3px}
  html.dark .warnrow code{background:#0c0e12;color:#f0d98a}
  .errrow{background:#e6b8b0;border:2px solid;border-color:#f0a090 #8a3a2a #8a3a2a #f0a090;
    color:#5a1a10;padding:6px 10px;font-size:15px;margin-bottom:6px;line-height:1.4}
  html.dark .errrow{background:#3a201c;border-color:#8a4030 #201010 #201010 #8a4030;color:#f0b0a0}
  .errrow code{background:rgba(0,0,0,.18);padding:0 3px}
  html.dark .errrow code{background:#0c0e12;color:#f0b0a0}
  .compName{user-select:none}
  .nbtnode{min-width:0}
  .nbtchildren{border-left:2px solid #3a4560;margin-left:6px;padding-left:8px}
  html.dark .nbtchildren{border-left-color:#2a3348}
  .nbtrow{margin:5px 0}
  .subgroup{border-left:2px solid #3a4560;margin:6px 0 6px 2px;padding:4px 0 4px 8px}
  html.dark .subgroup{border-left-color:#2a3348}
  .subhead{color:#8ea0c8;font-size:14px;margin-bottom:2px}
  html.dark .subhead{color:#7a86a0}
  .listitem{background:rgba(0,0,0,.12);border:1px dashed #6b6b6b;padding:6px;margin:5px 0}
  html.dark .listitem{border-color:#3a4560}
  /* text-component editor */
  .fmt{font-size:15px;padding:3px 9px 1px;min-width:30px}
  .fmt.on{background:#6d9c50;box-shadow:inset 2px 2px 0 #c8e8b0, inset -2px -2px 0 #2b451c;color:#fff}
  html.dark .fmt.on{background:#3d6b2a;box-shadow:inset 2px 2px 0 #6fa050, inset -2px -2px 0 #16280d}
  .cprev{display:block;margin-top:6px;background:#1a1a1a;border:2px solid;border-color:#555 #111 #111 #555;
    image-rendering:pixelated;max-width:100%}
  html.dark .cprev{background:#0c0e12}
  #out.mini #outText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #out.mini{padding-bottom:6px}
  .btn.sm{font-size:14px;padding:2px 8px 1px}
  .hexpick{width:44px;height:30px;padding:1px;border:2px solid #a0a0a0;background:#000;cursor:pointer}
  html.dark .hexpick{border-color:#4a5162}

  /* compact command strip: whole command as editable chips */
  .strip{display:flex;flex-wrap:wrap;gap:5px;align-items:center;background:#000;border:2px solid #a0a0a0;
    padding:8px;line-height:1.5}
  html.dark .strip{background:#0c0e12;border-color:#4a5162}
  .strip .slash{color:#54fc54;font-size:16px}
  .tok{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;font-size:15px;cursor:pointer;
    border:1px solid transparent;max-width:100%;min-width:0}
  .toklab{display:inline-block;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
  .tok.lit .toklab{color:#8cd97a}
  .tok.arg{background:#1c2436;border:1px solid #2f3f5f}
  .tok.arg .toklab{color:#cfe0ff}
  .tok.arg.empty .toklab{color:#f0a050;font-style:italic}
  .tok.sel{outline:2px solid #fcfc54;outline-offset:0}
  .tokx{color:#7a8296;font-size:13px;flex:0 0 auto}
  .tok:hover .tokx{color:#ff8a7a}
  .tok.lit .tokx{color:#4a5a3a}

  /* single editor for the selected token */
  .editpanel{background:#b8b8b8;border:2px solid #1a1a1a;box-shadow:inset 2px 2px 0 #e8e8e8, inset -2px -2px 0 #6b6b6b;padding:8px 10px;margin:10px 0}
  html.dark .editpanel{background:#1b1e25;border:2px solid #0a0c10;box-shadow:inset 2px 2px 0 #3f4552, inset -2px -2px 0 #10131a}
  .edhead .edname{color:#4a4a4a;font-size:15px}
  html.dark .edhead .edname{color:#9aa2b2}

  /* mobile: keep it all on screen, long chips clip with ... instead of runnin off the edge */
  html,body{overflow-x:hidden;max-width:100%}
  .wrap{overflow-x:hidden}
  input,select,textarea{max-width:100%}
  .compHead .compName{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .compHead .xbtn{flex:0 0 auto}
  @media(min-width:701px){ .toklab{max-width:460px} }
  @media(max-width:700px){ .wrap{padding:8px} #outText{font-size:15px} }
</style>
</head>

<script>try{if(localStorage.getItem("pvDark")==="1")document.documentElement.classList.add("dark");}catch(e){}</script>
<script src="ui/quotes.js"></script>
<script src="ui/common.js" defer></script>
<div class="wrap">
  <header>
    <h1>Command Generator</h1>
    <span class="splash" id="splash">Java 1.21.11!</span>
    <span class="hint">build any command, with the syntax done for you</span>
    <div class="hdrBtns">
      <a class="btn" href="index.html">&larr; Menu</a>
      <button id="darkBtn" class="iconBtn" title="Toggle dark mode" aria-label="Toggle dark mode"><svg class="ic-sun" viewBox="0 0 9 9" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><rect x="4" y="0" width="1" height="1"/><rect x="1" y="1" width="1" height="1"/><rect x="4" y="1" width="1" height="1"/><rect x="7" y="1" width="1" height="1"/><rect x="3" y="3" width="3" height="1"/><rect x="0" y="4" width="2" height="1"/><rect x="3" y="4" width="3" height="1"/><rect x="7" y="4" width="2" height="1"/><rect x="3" y="5" width="3" height="1"/><rect x="1" y="7" width="1" height="1"/><rect x="4" y="7" width="1" height="1"/><rect x="7" y="7" width="1" height="1"/><rect x="4" y="8" width="1" height="1"/></svg><svg class="ic-moon" viewBox="0 0 8 8" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="0" width="2" height="1"/><rect x="1" y="1" width="2" height="1"/><rect x="0" y="2" width="3" height="1"/><rect x="0" y="3" width="3" height="1"/><rect x="0" y="4" width="4" height="1"/><rect x="7" y="4" width="1" height="1"/><rect x="0" y="5" width="8" height="1"/><rect x="1" y="6" width="6" height="1"/><rect x="2" y="7" width="4" height="1"/></svg></button>
    </div>
  </header>

  <div id="out" class="panel">
    <div class="outRow" style="margin-top:0;margin-bottom:8px">
      <button id="outMin" class="btn sm" title="minimize output">&#8211;</button>
      <span class="small" style="align-self:center">output</span>
    </div>
    <div id="outText">/</div>
    <div class="outRow">
      <button id="copyBtn" class="primary">Copy</button>
      <button id="resetBtn">Reset</button>
      <span id="validity" class="valid"></span>
    </div>
  </div>

  <div id="importRow" class="panel" style="margin-bottom:12px">
    <div class="wrow">
      <input id="importIn" class="grow" placeholder="paste a command here to edit it" spellcheck="false" autocapitalize="off">
      <button id="importBtn" class="btn">import</button>
    </div>
    <div id="importMsg" class="small" style="margin-top:4px"></div>
  </div>

  <div id="warns" style="display:none"></div>

  <div id="builder" class="panel">
    <div class="loading" id="loadMsg">loading the commands...</div>
  </div>
</div>

<script>
(function(){
"use strict";
var DATA=null, ROOT=null;
var segments=[];
var sel=null;
var $=function(id){return document.getElementById(id);};


// lil helpers for walkin the command tree
function nodeAtPath(arr){ var n=DATA.tree; for(var i=0;i<arr.length;i++){ n=n.c[arr[i]]; } return n; }
function childrenOf(seg){
  var n = seg ? seg.node : DATA.tree;
  if(n.c) return n.c;
  if(n.rd){ var t=nodeAtPath(n.rd); return t?t.c:null; }
  if(seg && seg.key==='run') return DATA.tree.c;
  return null;
}
function isExecutable(seg){ return seg ? !!seg.node.x : false; }

// a sensible starting value for each arg type so nothin imports/adds broken
var DEF_RES={item:'stone',block:'stone',entity_type:'zombie',mob_effect:'speed',
  enchantment:'sharpness',attribute:'',sound_event:'',particle_type:'flame',dimension:'overworld',potion:''};
function regKeyFor(parser,props){
  if(props && props.registry){
    var r=props.registry.replace('minecraft:','');
    if(DATA.registries[r]) return r;
    return null;
  }
  return null;
}
function defaultValue(parser,props){
  props=props||{};
  switch(parser){
    case 'brigadier:integer': return String(props.min!=null?props.min:0);
    case 'brigadier:float': case 'brigadier:double': return String(props.min!=null?props.min:0);
    case 'brigadier:bool': return 'true';
    case 'minecraft:entity': case 'minecraft:score_holder':
      return (props.type==='players') ? '@p' : (props.amount==='single'?'@s':'@e');
    case 'minecraft:game_profile': return '@p';
    case 'minecraft:block_pos': case 'minecraft:vec3': return '~ ~ ~';
    case 'minecraft:column_pos': case 'minecraft:vec2': case 'minecraft:rotation': return '~ ~';
    case 'minecraft:item_stack': case 'minecraft:item_predicate': return 'stone';
    case 'minecraft:block_state': case 'minecraft:block_predicate': return 'stone';
    case 'minecraft:gamemode': return 'survival';
    case 'minecraft:item_slot': case 'minecraft:item_slots': return 'weapon.mainhand';
    case 'minecraft:dimension': return 'overworld';
    case 'minecraft:entity_anchor': return 'feet';
    case 'minecraft:color': return 'white';
    case 'minecraft:heightmap': return 'world_surface';
    case 'minecraft:swizzle': return 'xyz';
    case 'minecraft:scoreboard_slot': return 'sidebar';
    case 'minecraft:template_rotation': return 'none';
    case 'minecraft:template_mirror': return 'none';
    case 'minecraft:time': return '20';
    case 'minecraft:component': return '"Hello"';
    case 'minecraft:nbt_compound_tag': return '{}';
    case 'minecraft:nbt_tag': return '{}';
    case 'minecraft:nbt_path': return 'Health';
    case 'minecraft:int_range': case 'minecraft:float_range': return '1..5';
    case 'minecraft:message': return 'hi';
    case 'minecraft:uuid': return '';
    case 'minecraft:objective': return 'obj';
    case 'minecraft:objective_criteria': return 'dummy';
    case 'minecraft:team': return 'team';
    case 'minecraft:operation': return '=';
    case 'minecraft:particle': return 'flame';
    case 'minecraft:hex_color': return 'ffffff';
    case 'minecraft:style': return '{}';
    default:
      var rk = regKeyFor(parser,props);
      if(rk) return DEF_RES[rk]!=null?DEF_RES[rk]:'';
      return '';
  }
}

// build each dropdown list once n reuse it. item/block/sound are huge so dont redo em every time
var madeDL={};
var madeDL2={};
function listDatalist(id,arr){ if(madeDL2[id])return id; var dl=document.createElement('datalist'); dl.id=id;
  var f=document.createDocumentFragment(); for(var i=0;i<arr.length;i++){ var o=document.createElement('option'); o.value=arr[i]; f.appendChild(o); }
  dl.appendChild(f); document.body.appendChild(dl); madeDL2[id]=1; return id; }
function comboDatalist(reg,tagreg){
  var id='dl_'+reg+'__'+tagreg;
  var arr=(DATA.registries[reg]||[]).concat(DATA.registries[tagreg]||[]);
  return listDatalist(id,arr);
}
function ensureDatalist(reg){
  if(madeDL[reg]) return 'dl_'+reg;
  var list=DATA.registries[reg]; if(!list) return null;
  var dl=document.createElement('datalist'); dl.id='dl_'+reg;
  var frag=document.createDocumentFragment();
  for(var i=0;i<list.length;i++){ var o=document.createElement('option'); o.value=list[i]; frag.appendChild(o); }
  dl.appendChild(frag); document.body.appendChild(dl); madeDL[reg]=true; return dl.id;
}

// tiny dom makers so i stop typin createElement everywhere
function mkInput(val,cls,ph){ var i=document.createElement('input'); i.value=val==null?'':val;
  if(cls)i.className=cls; if(ph)i.placeholder=ph; return i; }
function mkSelect(opts,val){ var s=document.createElement('select');
  for(var i=0;i<opts.length;i++){ var o=document.createElement('option'); o.value=opts[i]; o.textContent=opts[i];
    if(opts[i]===val)o.selected=true; s.appendChild(o); } return s; }
function lbl(t){ var l=document.createElement('label'); l.className='lbl'; l.textContent=t; return l; }
function bindLive(el,seg,getter){
  el.addEventListener('input',function(){ seg.value=getter(); updateOutput(); });
  el.addEventListener('change',function(){ seg.value=getter(); updateOutput(); });
}
var NUM_BOUNDS={'minecraft:damage':[0,null],'minecraft:max_damage':[1,null],'minecraft:max_stack_size':[1,99],'minecraft:dyed_color':[0,16777215]};
var FIELD_MIN={nutrition:0,saturation:0,value:1,repair_cost:0,map_color:0,map_id:0,seconds:0,consume_seconds:0,potion_duration_scale:0,ominous_bottle_amplifier:0,item_damage_per_attack:0,disable_blocking_for_seconds:0,default_mining_speed:0,damage_per_block:0,min_reach:0,max_reach:0,hitbox_margin:0,min_creative_reach:0,max_creative_reach:0,mob_factor:0,speed_multiplier:0,minimum_attack_charge:0};
function clampNum(v,min,max){ if(v==null||isNaN(v))return (min!=null?min:0); if(min!=null&&v<min)v=min; if(max!=null&&v>max)v=max; return v; }

function argWidget(seg){
  var wrap=document.createElement('div'); wrap.className='wrow';
  var p=seg.parser, props=seg.props||{};

  if(p==='brigadier:integer'||p==='brigadier:float'||p==='brigadier:double'){
    var inp=mkInput(seg.value,'num'); inp.type='number';
    if(props.min!=null)inp.min=props.min; if(props.max!=null)inp.max=props.max;
    if(p!=='brigadier:integer')inp.step='any';
    bindLive(inp,seg,function(){return inp.value;}); wrap.appendChild(inp); return wrap;
  }
  if(p==='brigadier:bool'){ var sb=mkSelect(['true','false'],seg.value); bindLive(sb,seg,function(){return sb.value;}); wrap.appendChild(sb); return wrap; }

  var enumMap={'minecraft:gamemode':'gamemode','minecraft:item_slot':'item_slot','minecraft:item_slots':'item_slot',
    'minecraft:entity_anchor':'entity_anchor','minecraft:color':'color','minecraft:heightmap':'heightmap',
    'minecraft:swizzle':'swizzle','minecraft:scoreboard_slot':'scoreboard_slot','minecraft:operation':'operation',
    'minecraft:template_rotation':'template_rotation','minecraft:template_mirror':'template_mirror'};
  if(enumMap[p] && DATA.enums[enumMap[p]]){ var se=mkSelect(DATA.enums[enumMap[p]],seg.value);
    bindLive(se,seg,function(){return se.value;}); wrap.appendChild(se); return wrap; }
  if(p==='minecraft:dimension'){ var sd=mkSelect(DATA.registries.dimension,seg.value); bindLive(sd,seg,function(){return sd.value;}); wrap.appendChild(sd); return wrap; }

  if(p==='minecraft:block_pos'||p==='minecraft:vec3'||p==='minecraft:column_pos'||p==='minecraft:vec2'||p==='minecraft:rotation'){
    var n=(p==='minecraft:column_pos'||p==='minecraft:vec2'||p==='minecraft:rotation')?2:3;
    var parts=(seg.value||'').split(/\s+/); var boxes=[];
    for(var i=0;i<n;i++){ (function(idx){ var b=mkInput(parts[idx]!=null?parts[idx]:'~','coord');
      boxes.push(b); wrap.appendChild(b);
      var upd=function(){ seg.value=boxes.map(function(x){return x.value||'~';}).join(' '); updateOutput(); };
      b.addEventListener('input',upd); })(i); }
    return wrap;
  }

  if(p==='minecraft:entity'||p==='minecraft:score_holder'||p==='minecraft:game_profile'){
    if(seg.selArgs==null){
      var cur=(seg.value||'@e').trim();
      if(cur.charAt(0)!=='@'){ seg.selBase='name...'; seg.selName=cur; seg.selArgs=[]; seg.selRaw=''; }
      else { seg.selBase=cur.split('[')[0]||'@e'; seg.selArgs=[]; seg.selRaw='';
        var lb=cur.indexOf('['), rb=cur.lastIndexOf(']');
        if(lb>=0&&rb>lb){ splitTop(cur.slice(lb+1,rb)).forEach(function(pr){ pr=pr.trim(); if(!pr)return;
          var eq=pr.indexOf('='); if(eq<0){ seg.selRaw+=(seg.selRaw?',':'')+pr; return; }
          var k=pr.slice(0,eq).trim(), val=pr.slice(eq+1).trim(), neg=false; if(val.charAt(0)==='!'){ neg=true; val=val.slice(1); }
          if(SELECTOR_ARGS.indexOf(k)>=0) seg.selArgs.push({key:k,val:val,neg:neg});
          else seg.selRaw+=(seg.selRaw?',':'')+pr;
        }); }
      }
    }
    var box=document.createElement('div');
    var r0=document.createElement('div'); r0.className='wrow';
    var bases=['@p','@a','@e','@r','@s','@n','name...'];
    var bsel=mkSelect(bases, bases.indexOf(seg.selBase)>=0?seg.selBase:'@e');
    var nameBox=mkInput(seg.selName||'','grow','player name');
    r0.appendChild(bsel); r0.appendChild(nameBox); box.appendChild(r0);
    var rowsWrap=document.createElement('div');
    var addWrap=document.createElement('div'); addWrap.className='wrow'; addWrap.style.marginTop='4px';
    function selValInput(a){
      if(a.key==='type'){ var dl=ensureDatalist('entity_type'); var i=mkInput(a.val||'','grow','entity'); if(dl)i.setAttribute('list',dl); i.addEventListener('input',function(){a.val=i.value;recomputeSel(seg);}); return i; }
      if(a.key==='gamemode'){ var s=mkSelect(DATA.enums.gamemode,a.val||'survival'); s.addEventListener('change',function(){a.val=s.value;recomputeSel(seg);}); return s; }

var MC_HEX={black:'#000000',dark_blue:'#0000AA',dark_green:'#00AA00',dark_aqua:'#00AAAA',dark_red:'#AA0000',
  dark_purple:'#AA00AA',gold:'#FFAA00',gray:'#AAAAAA',dark_gray:'#555555',blue:'#5555FF',green:'#55FF55',
  aqua:'#55FFFF',red:'#FF5555',light_purple:'#FF55FF',yellow:'#FFFF55',white:'#FFFFFF'};
var COLOR_NAMES=['white','black','dark_blue','dark_green','dark_aqua','dark_red','dark_purple','gold','gray','dark_gray','blue','green','aqua','red','light_purple','yellow'];
function styleJSON(c){
  var o='{"text":'+jstr(c.text||'');
  if(c.color && c.color!=='white') o+=',"color":'+jstr(c.color);
  ['bold','italic','underline','strikethrough','obfuscated'].forEach(function(k){ if(c[k]) o+=',"'+k+'":true'; });
  return o+'}';
}
var OBF_CHARS='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789?#@%&';
function colorOf(c){ if(!c)return '#FFFFFF'; if(c.charAt(0)==='#')return c; return MC_HEX[c]||'#FFFFFF'; }
function drawPreview(cv,c){
  var ctx=cv.getContext&&cv.getContext('2d'); if(!ctx)return;
  ctx.imageSmoothingEnabled=false; ctx.clearRect(0,0,cv.width,cv.height);
  var col=colorOf(c.color), raw=c.text||'', x=6,y=7, t=raw;
  if(c.obfuscated){ t=''; for(var i=0;i<raw.length;i++){ t+=(raw.charAt(i)===' ')?' ':OBF_CHARS.charAt((Math.random()*OBF_CHARS.length)|0); } }
  ctx.textBaseline='top';
  ctx.font=(c.italic?'italic ':'')+(c.bold?'bold ':'')+'18px "MinecraftTTF","VT323",monospace';
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillText(t,x+2,y+2);
  ctx.fillStyle=col; ctx.fillText(t,x,y);
  var w=ctx.measureText?ctx.measureText(t).width:0;
  if(c.underline)ctx.fillRect(x,y+18,w,2);
  if(c.strikethrough)ctx.fillRect(x,y+9,w,2);
  if(c.obfuscated && cv.isConnected!==false){ setTimeout(function(){ if(cv.isConnected!==false) drawPreview(cv,c); },90); }
}
function textCompEditor(c,onchange,ph){
  if(c.color==null)c.color='white';
  var box=document.createElement('div');
  var r1=document.createElement('div'); r1.className='wrow';
  var ti=mkInput(c.text||'','grow',ph||'text');

  r1.appendChild(ti);
  [['B','bold'],['I','italic'],['U','underline'],['S','strikethrough'],['K','obfuscated']].forEach(function(pr){
    var b=document.createElement('button'); b.type='button'; b.className='fmt'+(c[pr[1]]?' on':''); b.textContent=pr[0]; b.title=pr[1];
    b.addEventListener('click',function(){ c[pr[1]]=!c[pr[1]]; b.classList.toggle('on',!!c[pr[1]]); upd(); });
    r1.appendChild(b);
  });
  box.appendChild(r1);
  var r2=document.createElement('div'); r2.className='wrow';
  var cs=mkSelect(COLOR_NAMES,(c.color&&c.color.charAt(0)!=='#')?c.color:'white');
  var hx=document.createElement('input'); hx.type='color'; hx.className='hexpick';
  hx.value=(c.color&&c.color.charAt(0)==='#')?c.color:(MC_HEX[c.color]||'#ffffff');
  cs.addEventListener('change',function(){ c.color=cs.value; hx.value=MC_HEX[cs.value]||'#ffffff'; upd(); });
  hx.addEventListener('input',function(){ c.color=hx.value.toLowerCase(); upd(); });
  r2.appendChild(lbl('color')); r2.appendChild(cs); r2.appendChild(lbl('or hex')); r2.appendChild(hx); box.appendChild(r2);
  var cv=document.createElement('canvas'); cv.className='cprev'; cv.width=320; cv.height=32; box.appendChild(cv);
  function upd(){ drawPreview(cv,c); onchange(); }
  setTimeout(function(){ drawPreview(cv,c); },0);
  return box;
}

function fmtVal(ty,v){
  if(ty==='int')return String(parseInt(v,10)||0);
  if(ty==='float')return String(v===''||v==null?0:v);

}
function serializeField(f,val){
  var ty=f[1];

  if(ty==='list'){ return '['+(val||[]).map(function(iv){ return serializeFields(f[2], iv||{}); }).join(',')+']'; }
  if(ty==='raw') return (val==null||val==='')?f[2]:String(val);
  if(ty==='idtag'){ var v=(val==null||val==='')?f[2]:val; v=String(v).trim(); return (v.charAt(0)==='[')?v:fmtVal('text',v); }
  if(val==null||val==='') val=(ty==='enum'?f[3]:f[2]);

}

// adding a chip n auto-jumpin thru the single-child bits
function pushSeg(key,node){
  var s={key:key,node:node,arg:(node.t==='a'),parser:node.p,props:node.pr};
  if(s.arg) s.value=defaultValue(s.parser,s.props);
  segments.push(s); return s;
}
function autoAdvance(){
  var guard=0;
  while(guard++<40){
    var last=segments[segments.length-1];
    if(!last) break;
    if(last.node.x) break;
    var ch=last.node.c;
    if(!ch) break;
    var keys=Object.keys(ch);
    if(keys.length!==1) break;
    var k=keys[0]; pushSeg(k,ch[k]);
  }
}
function pickChild(key,node){ pushSeg(key,node); autoAdvance();
  var li=segments.length-1; sel=(segments[li]&&segments[li].arg)?li:null; render(); }
function truncateTo(i){ segments=segments.slice(0,i); if(sel!=null&&sel>=segments.length)sel=null; render(); }

// paste a command back in n rebuild the chips. best effort, walks the tree token by token
function tokenize(s){
  var out=[],cur='',depth=0,q=null;
  for(var i=0;i<s.length;i++){ var c=s[i];
    if(q){ cur+=c; if(c==='\\'){ cur+=(s[++i]||''); continue; } if(c===q)q=null; continue; }
    if(c==='"'||c==="'"){ q=c; cur+=c; continue; }
    if(c==='['||c==='{'||c==='('){ depth++; cur+=c; continue; }
    if(c===']'||c==='}'||c===')'){ depth--; cur+=c; continue; }
    if(c===' '&&depth===0){ if(cur){out.push(cur);cur='';} continue; }
    cur+=c;
  }
  if(cur)out.push(cur);
  return out;
}
function importCommand(str){
  str=(str||'').trim().replace(/^\//,''); if(!str) return false;
  var toks=tokenize(str); if(!toks.length) return false;
  var segs=[], node=DATA.tree, i=0, guard=0;
  while(i<toks.length && guard++<200){
    var ch = node.c ? node.c : (node.rd ? (nodeAtPath(node.rd)||{}).c : null);
    if(!ch) break;
    var tok=toks[i];
    if(ch[tok] && ch[tok].t!=='a'){
      segs.push({key:tok,node:ch[tok],arg:false}); node=ch[tok]; i++;
      if(tok==='run') node=DATA.tree;
      continue;
    }
    var argKey=null,an=null;
    for(var k in ch){ if(ch[k].t==='a'){ argKey=k; an=ch[k]; break; } }
    if(!an) break;
    var p=an.p, consume=1, val;
    if(p==='minecraft:block_pos'||p==='minecraft:vec3'){ val=toks.slice(i,i+3).join(' '); consume=3; }
    else if(p==='minecraft:column_pos'||p==='minecraft:vec2'||p==='minecraft:rotation'){ val=toks.slice(i,i+2).join(' '); consume=2; }
    else { val=tok; }
    segs.push({key:argKey,node:an,arg:true,parser:p,props:an.pr,value:val});
    node=an; i+=consume;
    if(an.rd) node=nodeAtPath(an.rd)||node;
  }
  if(!segs.length) return false;
  segments=segs; sel=null; render();
  return true;
}

// the live command string + validity light
function tokenOf(s){ return s.arg ? (s.value!=null?s.value:'') : s.key; }
function buildString(){
  var parts=[]; for(var i=0;i<segments.length;i++){ var t=tokenOf(segments[i]); if(t!=='') parts.push(t); }
  return '/'+parts.join(' ');
}
function updateOutput(){

  else { v.textContent='needs more'; v.className='invalid'; }
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function tokDisplay(s){ return s.arg ? ((s.value!=null&&s.value!=='')?s.value:('<'+s.key+'>')) : s.key; }
function refreshTok(){ for(var i=0;i<segments.length;i++){ if(tokLabs[i]) tokLabs[i].textContent=tokDisplay(segments[i]); } }

// quick check the brackets n quotes actually close, catches the obvious typos
function balanced(s){
  var st=[], q=null, pair={')':'(',']':'[','}':'{'};
  for(var i=0;i<s.length;i++){ var c=s[i];
    if(q){ if(c==='\\'){ i++; continue; } if(c===q)q=null; continue; }
    if(c==='"'||c==="'"){ q=c; continue; }
    if(c==='('||c==='['||c==='{'){ st.push(c); }
    else if(c===')'||c===']'||c==='}'){ if(st.pop()!==pair[c]) return false; }
  }
  return st.length===0 && !q;
}
// split on the top level commas only, ignores the ones inside nested stuff
function splitTop(s){ var out=[],d=0,cur='',q=null;
  for(var i=0;i<s.length;i++){ var c=s[i];
    if(q){ cur+=c; if(c==='\\'){ cur+=(s[++i]||''); continue; } if(c===q)q=null; continue; }
    if(c==='"'||c==="'"){ q=c; cur+=c; continue; }
    if(c==='['||c==='{')d++; if(c===']'||c==='}')d--;
    if(c===','&&d===0){ out.push(cur); cur=''; } else cur+=c; }
  out.push(cur); return out;
}
// look over a selector, hand back errors (broken) n warnings (works but footgun)
var NUMSEL={distance:1,x:1,y:1,z:1,dx:1,dy:1,dz:1,x_rotation:1,y_rotation:1,level:1,limit:1};
function selectorCheck(key,v,pr){
  var e=[],w=[]; v=(v||'').trim();
  if(!v){ return {e:e,w:w}; }
  if(v.charAt(0)!=='@'){ return {e:e,w:w}; } // plain player name
  var base=v.slice(0,2), rest=v.slice(2);
  if(['@p','@a','@e','@r','@s','@n'].indexOf(base)<0){ e.push('unknown selector <code>'+esc(base)+'</code>'); return {e:e,w:w}; }
  if(rest){
    if(rest.charAt(0)!=='['){ e.push('expected <code>[</code> after '+base); }
    else if(!balanced(rest)){ e.push('unclosed <code>[ ]</code> in the '+base+' selector'); }
    else {
      var inner=rest.slice(1,rest.lastIndexOf(']'));
      splitTop(inner).forEach(function(p){ p=p.trim(); if(!p)return;
        var eq=p.indexOf('='); if(eq<0){ e.push('selector arg <code>'+esc(p)+'</code> is missing <code>=</code>'); return; }
        var k=p.slice(0,eq).trim(), val=p.slice(eq+1).trim().replace(/^!/,'');
        if(NUMSEL[k]){
          if(/[^0-9.\-]/.test(val) || !/[0-9]/.test(val)) e.push('<code>'+esc(k)+'=</code> needs a number or range, got <code>'+esc(val)+'</code>');
          else if(k==='limit' && (val.indexOf('.')>=0 || parseInt(val,10)<1)) e.push('<code>limit</code> must be a positive whole number');
        }
      });
    }
  }
  // single target command but the selector could grab loads, warn em
  if(pr && pr.amount==='single' && (base==='@e'||base==='@a') && !/limit\s*=\s*1(\b|,|\])/.test(v)){
    w.push('&#9888; <b>'+esc(key)+'</b> must target exactly one '+(pr.type==='players'?'player':'entity')+
      ', but <code>'+esc(v)+'</code> can match several. use <code>@s/@p/@r</code>, add <code>[limit=1]</code>, or run it as <code>execute as '+esc(v)+' run &lt;cmd&gt; @s</code>');
  }
  return {e:e,w:w};
}
var SNBT={'minecraft:nbt_compound_tag':1,'minecraft:nbt_tag':1,'minecraft:style':1,'minecraft:component':1,
  'minecraft:block_state':1,'minecraft:block_predicate':1,'minecraft:item_stack':1,'minecraft:item_predicate':1};
function validate(){
  var box=$('warns'); if(!box) return 0;
  var errs=[], warns=[];
  for(var i=0;i<segments.length;i++){
    var s=segments[i]; if(!s.arg) continue;
    if(s.parser==='minecraft:entity'||s.parser==='minecraft:game_profile'||s.parser==='minecraft:score_holder'){
      var r=selectorCheck(s.key,s.value,s.props||{}); errs=errs.concat(r.e); warns=warns.concat(r.w);
    }
    if(SNBT[s.parser] && s.value && !balanced(s.value)){
      errs.push('<b>'+esc(s.key)+'</b> has a bracket, brace, or quote that doesn\'t close');
    }
  }
  var rows=errs.map(function(x){return '<div class="errrow">&#10007; '+x+'</div>';})
    .concat(warns.map(function(x){return '<div class="warnrow">'+x+'</div>';}));
  if(!rows.length){ box.style.display='none'; box.innerHTML=''; }
  else { box.style.display=''; box.innerHTML=rows.join(''); }
  return errs.length;
}

    try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); done(); }
});
$('resetBtn').addEventListener('click',function(){ segments=[]; sel=null; render(); });
$('outMin').addEventListener('click',function(){
  var mini=$('out').classList.toggle('mini');
  $('outMin').innerHTML = mini?'+':'&#8211;';
});
$('importBtn').addEventListener('click',function(){
  var ok=importCommand($('importIn').value);
  $('importMsg').textContent = ok ? 'got it, edit the chips below' : "couldn't read that one, make sure it is an actual command";
  $('importMsg').style.color = ok ? '' : '#c04a3a';
});
$('importIn').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); $('importBtn').click(); } });

// pull the command data n kick it off
fetch('command-data.min.json').then(function(r){ if(!r.ok)throw new Error(r.status); return r.json(); })
.then(function(d){ DATA=d; ROOT=d.tree; var lm=$('loadMsg'); if(lm)lm.remove(); render(); })
.catch(function(e){
  $('builder').innerHTML='<div class="loading">couldn\'t load command-data.min.json ('+e.message+'). '+
    'make sure it sits next to this html file in the repo.</div>';
});
})();</script>
</body>
</html>
